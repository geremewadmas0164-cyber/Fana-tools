name: Build Fana Tools APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Extract Fana Tools project
        run: |
          if [ -f "Fana_Tools_Application_2.0.zip" ]; then
            unzip -o Fana_Tools_Application_2.0.zip
          fi

      - name: Create Android platform
        run: flutter create . --platforms=android --org=com.fanatools.app

      - name: Get Flutter packages
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fana-Tools-APK
          path: build/app/outputs/flutter-apk/app-release.apk
